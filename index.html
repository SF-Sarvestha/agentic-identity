<title>AI agents — Enterprise AI Harness</title>
<style>
  :root {
    --bg: #f5f7fb;
    --card: #ffffff;
    --ink: #1b1f27;
    --muted: #5d6775;
    --faint: #8b95a3;
    --line: #e6e9f0;
    --line-strong: #d7dce6;
    --blue: #1f6feb;
    --blue-dark: #1558c0;
    --blue-soft: #e8f1fe;
    --blue-ring: #b9d4fb;
    --nav: #eaf2ff;
    --red-bg: #fdeeee;
    --red-line: #f6c9c9;
    --red: #c4322a;
    --red-btn: #d23b32;
    --amber-bg: #fff6e4;
    --amber-line: #f3dfb4;
    --amber: #9a6700;
    --green-bg: #e7f7ee;
    --green: #157a3a;
    --purple-bg: #f3eaff;
    --purple: #6941c6;
    --pink-row: #fff6f6;
    --shadow: 0 18px 50px rgba(22, 34, 58, 0.16);
    --sidebar: 232px;
    --header: 56px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Salesforce Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: var(--ink);
    background: var(--bg);
    font-size: 13px;
  }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .app { display: grid; grid-template-columns: var(--sidebar) 1fr; grid-template-rows: var(--header) 1fr; height: 100%; }
  .topbar {
    grid-column: 1 / -1;
    display: flex; align-items: center; gap: 16px;
    padding: 0 16px;
    background: #fff;
    border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 650; width: calc(var(--sidebar) - 16px); }
  .brand-mark {
    width: 22px; height: 22px; border-radius: 6px;
    background: linear-gradient(135deg, #5b8def, #1f6feb);
  }
  .search {
    flex: 1; max-width: 560px; margin: 0 auto;
    display: flex; align-items: center; gap: 8px;
    background: #f3f5f8; border-radius: 999px; padding: 7px 14px; color: var(--faint);
  }
  .search input { border: 0; background: transparent; outline: none; width: 100%; color: var(--ink); }
  .ask {
    border: 1px solid var(--line-strong); background: #fff; border-radius: 999px;
    padding: 6px 12px; display: flex; gap: 6px; align-items: center;
  }
  .top-icons { display: flex; align-items: center; gap: 10px; color: var(--muted); margin-left: 8px; }
  .avatar {
    width: 28px; height: 28px; border-radius: 50%; background: #1f6feb; color: #fff;
    display: grid; place-items: center; font-size: 11px; font-weight: 700;
  }
  .sidebar { background: #fff; border-right: 1px solid var(--line); overflow: auto; padding: 10px 10px 24px; }
  .nav-item, .nav-sub {
    display: flex; align-items: center; gap: 8px;
    width: 100%; border: 0; background: transparent; text-align: left;
    border-radius: 8px; color: #2c3340;
  }
  .nav-item { padding: 8px 10px; font-weight: 550; }
  .nav-sub { padding: 7px 10px 7px 32px; color: #3a4250; }
  .nav-item.active, .nav-sub.active { background: var(--nav); color: #0b4db3; font-weight: 650; }
  .badge {
    margin-left: auto; font-size: 10px; font-weight: 700; letter-spacing: .04em;
    background: #ece7ff; color: #6941c6; border-radius: 999px; padding: 2px 6px;
  }
  .badge.gray { background: #eef1f5; color: #5d6775; }
  .chev { margin-left: auto; color: var(--faint); }
  .main { overflow: auto; padding: 18px 22px 40px; }
  .crumbs { color: var(--muted); font-size: 12px; margin-bottom: 10px; }
  .crumbs button { border: 0; background: none; color: var(--muted); padding: 0; }
  .crumbs button:hover { color: var(--blue); }
  .page-head { display: flex; gap: 14px; align-items: flex-start; margin-bottom: 14px; }
  .page-icon {
    width: 36px; height: 36px; border-radius: 10px; background: var(--blue-soft); color: var(--blue);
    display: grid; place-items: center; flex: none;
  }
  h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -0.02em; }
  .lede { margin: 0; color: var(--muted); max-width: 640px; line-height: 1.45; }
  .head-actions { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  .btn {
    border-radius: 8px; border: 1px solid transparent; padding: 8px 12px; font-weight: 650;
  }
  .btn.primary { background: var(--blue); color: #fff; }
  .btn.primary:hover { background: var(--blue-dark); }
  .btn.primary:disabled { background: #b9cdf2; cursor: default; }
  .btn.quiet { background: #fff; border-color: var(--line-strong); }
  .btn.danger { background: var(--red-btn); color: #fff; }
  .btn.ghost { background: transparent; color: var(--muted); }
  .banner {
    display: flex; gap: 12px; align-items: flex-start;
    border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; border: 1px solid transparent;
  }
  .banner strong { display: block; margin-bottom: 2px; }
  .banner p { margin: 0; color: #3d4654; line-height: 1.45; }
  .banner.red { background: var(--red-bg); border-color: var(--red-line); }
  .banner.amber { background: var(--amber-bg); border-color: var(--amber-line); }
  .banner.green { background: #e9f8ef; border-color: #b7e4c7; }
  .banner .btn { margin-left: auto; flex: none; align-self: center; }
  .panel { background: #fff; border: 1px solid var(--line); border-radius: 14px; }
  .tabs { display: flex; gap: 0; padding: 0 8px; border-bottom: 1px solid var(--line); }
  .tab {
    border: 0; background: transparent; padding: 12px 14px 10px; text-align: left; border-bottom: 2px solid transparent;
  }
  .tab small { display: block; color: var(--faint); font-weight: 450; margin-top: 2px; }
  .tab.on { border-bottom-color: var(--blue); color: var(--blue); }
  .tab .count {
    display: inline-grid; place-items: center; min-width: 18px; height: 18px; padding: 0 5px;
    border-radius: 999px; background: #eef1f6; font-size: 11px; margin-left: 4px;
  }
  .tab.on .count { background: var(--blue-soft); color: var(--blue); }
  .toolbar {
    display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-bottom: 1px solid var(--line);
  }
  .toolbar .grow {
    flex: 1; display: flex; align-items: center; gap: 8px;
    border: 1px solid var(--line-strong); border-radius: 8px; padding: 7px 10px; color: var(--faint);
  }
  .toolbar input { border: 0; outline: none; width: 100%; color: var(--ink); }
  .toolbar select, .field input, .field textarea {
    border: 1px solid var(--line-strong); border-radius: 8px; padding: 8px 10px; background: #fff;
  }
  .meta { color: var(--muted); white-space: nowrap; }
  table { width: 100%; border-collapse: collapse; }
  th {
    text-align: left; font-size: 11px; letter-spacing: .04em; color: var(--faint);
    font-weight: 700; padding: 10px 12px; border-bottom: 1px solid var(--line);
  }
  td { padding: 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  tr.agent { cursor: pointer; }
  tr.agent:hover td { background: #f7f9fd; }
  tr.needs td { background: var(--pink-row); box-shadow: inset 3px 0 0 var(--red-btn); }
  .name { font-weight: 680; }
  .sub { color: var(--red); font-size: 12px; margin-top: 2px; }
  .pill {
    display: inline-flex; align-items: center; border-radius: 999px; padding: 3px 8px;
    font-size: 12px; font-weight: 650; line-height: 1.3;
  }
  .pill.user { background: var(--purple-bg); color: var(--purple); }
  .pill.enterprise { background: var(--green-bg); color: var(--green); }
  .pill.ok { background: var(--green-bg); color: var(--green); }
  .pill.bad { background: #fde8e8; color: var(--red); }
  .pill.warn { background: #fff1d6; color: #9a5b00; }
  .client { color: var(--muted); font-size: 12px; margin-top: 3px; }
  .auth-sub, .access-sub { color: var(--muted); font-size: 12px; }
  .client-id { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; color: #3c4656; }
  .foot { display: flex; justify-content: space-between; color: var(--muted); padding: 10px 4px; }
  .stats {
    display: grid; grid-template-columns: repeat(6, 1fr); gap: 0;
    border: 1px solid var(--line); border-radius: 12px; background: #fff; margin: 12px 0;
  }
  .stat { padding: 12px 14px; border-right: 1px solid var(--line); }
  .stat:last-child { border-right: 0; }
  .stat span { display: block; color: var(--muted); margin-bottom: 4px; }
  .stat b { font-weight: 650; }
  .stat b.bad { color: var(--red); }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0 14px; }
  .detail-tabs { display: flex; gap: 18px; border-bottom: 1px solid var(--line); margin-top: 8px; }
  .detail-tabs button { border: 0; background: none; padding: 10px 0; color: var(--muted); border-bottom: 2px solid transparent; }
  .detail-tabs button.on { color: var(--ink); border-bottom-color: var(--blue); font-weight: 700; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-top: 14px; }
  .card h2 { margin: 0 0 6px; font-size: 16px; }
  .flow { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 14px; }
  .flow div { background: #f7f9fc; border-radius: 10px; padding: 12px; }
  .flow b { display: block; margin-bottom: 4px; }
  .people { width: 100%; }
  .dot {
    width: 28px; height: 28px; border-radius: 50%; background: #e7eefc; color: #1f4fa3;
    display: inline-grid; place-items: center; font-size: 11px; font-weight: 700; margin-right: 8px;
  }
  .backdrop {
    position: fixed; inset: 0; background: rgba(20, 28, 42, 0.38);
    display: flex; align-items: flex-start; justify-content: center; padding: 48px 20px;
    z-index: 20;
  }
  .modal {
    width: min(760px, 100%); background: #fff; border-radius: 16px;
    box-shadow: var(--shadow); display: flex; flex-direction: column; max-height: calc(100vh - 96px);
  }
  .modal header, .modal footer {
    display: flex; align-items: center; gap: 12px; padding: 14px 18px;
  }
  .modal header { position: relative; justify-content: center; border-bottom: 1px solid var(--line); }
  .modal footer { border-top: 1px solid var(--line); }
  .modal header h2 { margin: 0; font-size: 16px; text-align: center; }
  .modal header .x { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); margin-left: 0; }
  .kicker { color: var(--muted); font-size: 12px; }
  .x {
    margin-left: auto; border: 0; background: transparent; font-size: 20px; line-height: 1; color: var(--muted);
  }
  .modal .body { padding: 18px 20px 22px; overflow: auto; }
  .stepper { display: flex; align-items: flex-start; list-style: none; margin: 0 0 22px; padding: 0; }
  .step {
    flex: 1; position: relative; display: flex; flex-direction: column; align-items: center;
    gap: 8px; text-align: center; color: var(--faint); font-size: 12px; min-width: 0;
  }
  .step .dot {
    width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--line-strong);
    background: #fff; display: grid; place-items: center; font-weight: 700; z-index: 1;
  }
  .step::before {
    content: ""; position: absolute; top: 13px; left: -50%; width: 100%; height: 2px; background: var(--line-strong);
  }
  .step:first-child::before { display: none; }
  .step.done, .step.on { color: var(--ink); }
  .step.on { font-weight: 700; }
  .step .opt { display: block; color: var(--faint); font-weight: 450; font-size: 11px; }
  .req { color: var(--red); }
  .step.done .dot, .step.on::before, .step.done::before { background: var(--blue); border-color: var(--blue); color: #fff; }
  .step.on .dot { border-color: var(--blue); color: var(--blue); box-shadow: 0 0 0 4px var(--blue-soft); }
  .variant-float {
    position: fixed; right: 24px; bottom: 24px; z-index: 40;
    display: flex; align-items: center; gap: 8px;
    padding: 6px 6px 6px 10px; background: #fff; border: 1px solid var(--line);
    border-radius: 999px; box-shadow: var(--shadow); cursor: grab; user-select: none; touch-action: none;
  }
  .variant-float.dragging { cursor: grabbing; }
  .variant-float .grip { color: var(--faint); font-size: 14px; letter-spacing: -2px; line-height: 1; }
  .variants { display: flex; border: 1px solid var(--line-strong); border-radius: 999px; overflow: hidden; }
  .variants button { border: 0; background: #fff; padding: 8px 12px; color: var(--muted); cursor: pointer; }
  .variants button.on { background: var(--blue-soft); color: var(--blue); font-weight: 700; }
  .variants button + button { border-left: 1px solid var(--line-strong); }
  .modal.b { width: min(980px, calc(100vw - 40px)); }

  .modal-split aside { border-right: 1px solid var(--line); background: #f7f9fc; }
  .modal-split .pane { padding: 18px 20px 22px; overflow: auto; }
  .stepper.vertical { flex-direction: column; margin: 0; padding: 20px 16px; height: 100%; }
  .stepper.vertical .step { flex: none; flex-direction: row; align-items: flex-start; text-align: left; gap: 10px; padding: 0 0 26px; }
  .stepper.vertical .step:last-child { padding-bottom: 0; }
  .stepper.vertical .step > span:last-child { padding-top: 4px; line-height: 1.35; }
  .stepper.vertical .step::before { top: 28px; left: 13px; width: 2px; height: calc(100% - 28px); }
  .stepper.vertical .step:first-child::before { display: block; }
  .stepper.vertical .step:last-child::before { display: none; }
  .stepper.vertical .step.on::before { background: var(--line-strong); }
  .stepper.vertical .step .opt { display: inline; margin-left: 6px; }
  .choice {
    width: 100%; text-align: left; background: #fff; border: 1px solid var(--line-strong);
    border-radius: 12px; padding: 14px; margin-bottom: 10px; display: flex; gap: 12px; align-items: flex-start;

  .choice.stack { flex-direction: column; align-items: stretch; gap: 0; }
  .choice-hit {
    display: flex; gap: 12px; align-items: flex-start; width: 100%;
    border: 0; background: transparent; text-align: left; padding: 0; cursor: pointer;
  }
  .choice-extra { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
  .choice-extra .field { margin-top: 0; }
  .choice.on { border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-soft); }
  .choice b { display: block; margin-bottom: 3px; }
  .choice p { margin: 0; color: var(--muted); line-height: 1.4; }
  .radio {
    width: 16px; height: 16px; border-radius: 50%; border: 2px solid #b7c0ce; flex: none; margin-top: 2px;
    display: grid; place-items: center;
  }
  .choice.on .radio { border-color: var(--blue); }
  .choice.on .radio::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--blue); }
  .rec {
    display: inline-block; margin-left: 6px; background: var(--blue-soft); color: var(--blue);
    border-radius: 999px; padding: 1px 6px; font-size: 11px; font-weight: 700;
  }
  .field { margin-top: 14px; }
  .field label { display: block; font-weight: 680; margin-bottom: 4px; }
  .field .help { color: var(--muted); margin: 0 0 6px; }
  .field input, .field select { width: 100%; }
  .checkline { display: flex; gap: 10px; align-items: flex-start; margin: 4px 0 12px; }
  .checkline input { margin-top: 3px; }
  .oauth { border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-bottom: 4px; background: #f8fafc; }
  .oauth .tag { font-size: 11px; letter-spacing: .06em; color: var(--faint); font-weight: 700; margin-bottom: 8px; }
  .summary { background: #f7f9fc; border-radius: 12px; padding: 12px 14px; margin-top: 14px; }
  .summary div { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .summary div:last-child { border-bottom: 0; }
  .spacer { margin-left: auto; }
  .note { color: var(--muted); font-size: 12px; }
  .hidden { display: none !important; }
</style>
</head>

  { name: "Revenue Recognition Agent", type: "enterprise", client: "Confidential", auth: "JWT", provider: "Salesforce Trust", access: "", scope: "Not set up", scopeTone: "bad", needsAccess: true, clientId: "3MVG9RevRec0gn1tionAgent" },
  { name: "Supplier Risk Monitor", type: "enterprise", client: "Confidential", auth: "JWT", provider: "Salesforce Trust", access: "", scope: "Not set up", scopeTone: "bad", needsAccess: true, clientId: "3MVG9SupRiskM0n1t0rAgent" }
];

const state = {
  view: "list",
  agent: null,
  tab: "all",
  query: "",
  scope: "all",
  onlyNoAccess: false,
  detailTab: "Overview",
  toast: "",
  modal: null,
  variation: "A"
};

const UNSCOPED = ["Freight Route Optimizer", "Glossary Curator", "Meeting Notes Copilot", "Pipeline Coach", "Desktop Research Assistant", "Invoice Processing Agent"];
const NO_ACCESS = ["Supplier Risk Monitor", "Field Service Dispatcher", "Revenue Recognition Agent"];

function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

function counts() {
  return {
    all: AGENTS.length,
    user: AGENTS.filter(a => a.type === "user").length,
    enterprise: AGENTS.filter(a => a.type === "enterprise").length
  };
}

function visible() {
  return AGENTS.filter(a => {
    if (state.tab === "user" && a.type !== "user") return false;
    if (state.tab === "enterprise" && a.type !== "enterprise") return false;
    if (state.onlyNoAccess && !a.needsAccess) return false;
    if (state.scope === "not" && a.scope !== "Not scoped") return false;
    if (state.scope !== "all" && state.scope !== "not" && a.scope !== state.scope) return false;
    const q = state.query.trim().toLowerCase();
    if (!q) return true;
    return [a.name, a.provider, a.access, a.clientId, a.auth].join(" ").toLowerCase().includes(q);
  });
}

function listView() {
  const c = counts();
  const rows = visible();
  const unscopedCount = AGENTS.filter(a => a.needsScope).length;
  return `
    <div class="crumbs">Secure / Agent identity / AI agents</div>
    <div class="page-head">
      <div class="page-icon">▣</div>
      <div>
        <h1>AI agents</h1>
        <p class="lede">Authorize external AI agents to call Salesforce. User agents act for the signed-in person; enterprise agents run under their own identity.</p>
      </div>
      <div class="head-actions">
        <button class="btn primary" id="add-agent">Register agent</button>
      </div>
    </div>
    ${state.toast ? `<div class="banner green"><div><strong>${esc(state.toast)}</strong></div></div>` : ""}
    <div class="banner red">
      <div>
        <strong>${unscopedCount} agents have no scoped access</strong>
        <p>${UNSCOPED.filter(n => AGENTS.find(a => a.name === n && a.needsScope)).join(", ").replace(/, ([^,]*)$/, " and $1")} aren't limited by any scope, so they can reach everything their permission set allows. Assign a scope before they go further.</p>
      </div>
      <button class="btn danger" id="toggle-unscoped">${state.scope === "not" ? "Show all agents" : "Show unscoped agents"}</button>
    </div>
    <div class="banner amber">
      <div>
        <strong>3 enterprise agents have no access set up</strong>
        <p>Supplier Risk Monitor, Field Service Dispatcher and Revenue Recognition Agent are registered but have no permission set, so Salesforce refuses their calls.</p>
      </div>
      <button class="btn quiet" id="toggle-noaccess">${state.onlyNoAccess ? "Show all agents" : "Show these agents"}</button>
    </div>
    <section class="panel">
      <div class="tabs">
        ${tab("all", "All agents", c.all, "Every registered agent")}
        ${tab("user", "User agents", c.user, "Public clients · act for a user")}
        ${tab("enterprise", "Enterprise agents", c.enterprise, "Confidential clients · own identity")}
      </div>
      <div class="toolbar">
        <label class="grow">⌕ <input id="q" placeholder="Search name, provider, permission set or client ID" value="${esc(state.query)}" /></label>
        <span class="meta">Scoped access</span>
        <select id="scope">
          ${["all", "Sandboxed", "A2A · scoped", "Not scoped", "Restricted · under review", "Not set up"].map(v => `<option value="${v === "all" ? "all" : v === "Not scoped" ? "not" : v}" ${state.scope === (v === "Not scoped" ? "not" : v === "all" ? "all" : v) ? "selected" : ""}>${v === "all" ? "All scopes" : v}</option>`).join("")}
        </select>
        ${(state.scope !== "all" || state.onlyNoAccess || state.query) ? `<button class="btn ghost" id="clear">Clear filters</button>` : ""}
        <span class="meta">${rows.length} of ${AGENTS.length} agents · sorted by name (A–Z)</span>
      </div>
      <table>
        <thead><tr>
          <th>AI AGENT</th><th>TYPE</th><th>AUTHENTICATION</th><th>ACCESS FROM</th><th>SCOPED ACCESS</th><th>CLIENT ID</th>
        </tr></thead>
        <tbody>
          ${rows.map(a => `
            <tr class="agent ${a.needsScope ? "needs" : ""}" data-name="${esc(a.name)}">
              <td><div class="name">${esc(a.name)}</div>${a.needsScope ? `<div class="sub">Needs a scope</div>` : ""}</td>
              <td><span class="pill ${a.type}">${a.type === "user" ? "User agent" : "Enterprise agent"}</span><div class="client">${a.client} client</div></td>
              <td>${esc(a.auth)}<div class="auth-sub">${esc(a.provider)}</div></td>
              <td>${a.type === "user" ? `${a.access ? esc(a.access) : "Connected users' access"}<div class="access-sub">${a.access ? "Connected users' access" : ""}${a.users ? `${a.access ? " · " : ""}${a.users} users connected` : ""}</div>` : (a.access ? esc(a.access) : `<span class="sub">No permission set</span>`)}</td>
              <td><span class="pill ${a.scopeTone}">${esc(a.scope)}</span></td>
              <td class="client-id">${esc(a.clientId)}</td>
            </tr>`).join("")}
        </tbody>
      </table>
    </section>
    <div class="foot"><span>${c.all} agents registered · ${c.user} user · ${c.enterprise} enterprise</span><span>Updated a few seconds ago</span></div>`;
}

function tab(id, label, count, sub) {
  return `<button class="tab ${state.tab === id ? "on" : ""}" data-tab="${id}"><b>${label}</b> <span class="count">${count}</span><small>${sub}</small></button>`;
}

function detailView() {
  const a = AGENTS.find(x => x.name === state.agent);
  const idx = AGENTS.findIndex(x => x.name === state.agent);
  const typeLabel = a.type === "user" ? "User agent" : "Enterprise agent";
  return `
    <div class="crumbs"><button id="back-list">Secure</button> / Agent identity / <button id="back-list-2">AI agents</button> / ${esc(a.name)}</div>
    <div class="page-head">
      <div class="page-icon">${a.type === "user" ? "👤" : "▣"}</div>
      <div>
        <h1>${esc(a.name)}</h1>
        <div class="chips">
          <span class="pill ${a.type}">${typeLabel}</span>
          <span class="pill">${a.client} client</span>
          <span class="pill">${esc(a.auth)} · ${esc(a.provider)}</span>
          <span class="pill ${a.scopeTone}">${esc(a.scope)}</span>
        </div>
      </div>
      <div class="head-actions">
        <span class="meta">${idx + 1} of ${AGENTS.length}</span>
        <button class="btn quiet">Edit</button>
      </div>
    </div>
    ${a.needsScope ? `<div class="banner red"><div><strong>This agent has no scoped access</strong><p>${a.type === "user" ? "Nothing narrows what it can reach beyond each signed-in user's own access. Add a scope before it handles production data." : `Nothing narrows what it can reach beyond ${esc(a.access)}. Add a scope before it handles production data.`}</p></div><button class="btn danger">Add scope</button></div>` : ""}
    ${a.needsAccess ? `<div class="banner amber"><div><strong>Access isn't set up yet</strong><p>This agent is registered but has no permission set, so Salesforce refuses its calls. Assign a permission set, then add a scope.</p></div><button class="btn quiet">Set up access</button></div>` : ""}
    <div class="stats">
      <div class="stat"><span>Agent type</span><b>${typeLabel}</b></div>
      <div class="stat"><span>Client type</span><b>${a.client}</b></div>
      <div class="stat"><span>Authentication</span><b>${esc(a.auth)} via ${esc(a.provider)}</b></div>
      <div class="stat"><span>${a.type === "user" ? "Access from" : "Permission sets"}</span><b class="${a.needsAccess ? "bad" : ""}">${a.type === "user" ? "Each connected user's access" : (a.access || "None assigned")}</b></div>
      <div class="stat"><span>Scoped access</span><b class="${a.scopeTone === "bad" ? "bad" : ""}">${esc(a.scope)}</b></div>
      <div class="stat"><span>Client ID</span><b>${esc(a.clientId)}</b></div>
    </div>
    <div class="detail-tabs">
      ${["Overview", a.type === "user" ? `Access ${a.users} users` : "Access 1 set", "Scope", "Credentials"].map(t => `<button class="${state.detailTab === t || (t.startsWith("Access") && state.detailTab.startsWith("Access")) ? "on" : ""}" data-dtab="${t}">${t}</button>`).join("")}
    </div>
    ${state.detailTab.startsWith("Access") ? accessTab(a) : overviewTab(a)}`;
}

function overviewTab(a) {
  if (a.type === "user") {
    return `<section class="card">
      <h2>How this agent gets access</h2>
      <p class="lede">A user agent works on behalf of whoever connects it, so it can never do more than that person can.</p>
      <div class="flow">
        <div><b>SIGNS IN</b>${esc(a.auth)} via ${esc(a.provider)}<div class="access-sub">A person connects the agent with their own login.</div></div>
        <div><b>ACTS AS</b>The signed-in user<div class="access-sub">Each call carries that user's own record access and sharing.</div></div>
        <div><b>LIMITED BY</b>${a.needsScope ? "Only the user's own access" : esc(a.scope)}<div class="access-sub">${a.needsScope ? "No scope narrows this. The agent can do anything the signed-in user can." : "A scope narrows that access. It never adds access."}</div></div>
      </div>
    </section>`;
  }
  return `<section class="card">
    <h2>How this agent gets access</h2>
    <p class="lede">An enterprise agent acts as itself. Salesforce allows a call only when a permission set is assigned, then a scope can narrow it.</p>
    <div class="flow">
      <div><b>AUTHENTICATES</b>${esc(a.auth)} via ${esc(a.provider)}<div class="access-sub">No person is signed in.</div></div>
      <div><b>ACTS AS</b>Its own identity<div class="access-sub">Confidential client.</div></div>
      <div><b>ALLOWED BY</b>${a.access || "No permission set"}<div class="access-sub">${a.needsAccess ? "Every call is refused until a permission set is assigned." : "A scope can still narrow this. It never adds access."}</div></div>
    </div>
  </section>`;
}

function accessTab(a) {
  if (a.type !== "user") return `<section class="card"><h2>Permission sets</h2><p>${a.access ? esc(a.access) : "None yet. Until one is assigned, every call from this agent is refused."}</p></section>`;
  const people = [
    ["PR", "Priya Raman", "Sales User", "EMEA Sales Rep", "2 hours ago"],
    ["DO", "Daniel Okafor", "Service User", "Support Agent", "Yesterday"],
    ["ML", "Mei Lin", "Sales Manager", "APAC Sales Manager", "3 days ago"],
    ["AM", "Arjun Mehta", "System Administrator", "IT Admin", "Last week"],
    ["SG", "Sofia Garcia", "Sales User", "Account Executive", "Last week"]
  ];
  return `<section class="card">
    <h2>Access comes from connected users</h2>
    <p class="lede">This is a user agent, so it has no permission set of its own. Each call runs with the access of the person who connected it.</p>
    <div class="stats" style="margin-top:12px"><div class="stat"><span>Users connected</span><b>${a.users}</b></div><div class="stat"><span>Distinct profiles</span><b>5</b></div><div class="stat"><span>Admin-level users</span><b>1</b></div></div>
    <table class="people"><thead><tr><th>USER</th><th>PROFILE</th><th>ROLE</th><th>LAST USED AGENT</th></tr></thead>
    <tbody>${people.map(p => `<tr><td><span class="dot">${p[0]}</span>${p[1]}</td><td>${p[2]}</td><td>${p[3]}</td><td>${p[4]}</td></tr>`).join("")}</tbody></table>
  </section>`;
}

function render() {
  document.getElementById("main").innerHTML = state.view === "list" ? listView() : detailView();
  document.querySelectorAll("[data-variant]").forEach(el => el.classList.toggle("on", el.dataset.variant === state.variation));
  renderModal();
  bind();
}

function bind() {
  document.querySelectorAll("[data-tab]").forEach(el => el.onclick = () => { state.tab = el.dataset.tab; state.onlyNoAccess = false; render(); });
  document.querySelectorAll("tr.agent").forEach(el => el.onclick = () => { state.agent = el.dataset.name; state.view = "detail"; state.detailTab = "Overview"; state.toast = ""; render(); });
  const q = document.getElementById("q");
  if (q) q.oninput = () => { state.query = q.value; render(); q.focus(); };
  const scope = document.getElementById("scope");
  if (scope) scope.onchange = () => { state.scope = scope.value; render(); };
  const add = document.getElementById("add-agent");
  if (add) add.onclick = openAdd;
  const un = document.getElementById("toggle-unscoped");
  if (un) un.onclick = () => { state.scope = state.scope === "not" ? "all" : "not"; state.onlyNoAccess = false; state.tab = "all"; render(); };
  const na = document.getElementById("toggle-noaccess");
  if (na) na.onclick = () => { state.onlyNoAccess = !state.onlyNoAccess; if (state.onlyNoAccess) { state.tab = "enterprise"; state.scope = "all"; } render(); };
  const clear = document.getElementById("clear");
  if (clear) clear.onclick = () => { state.query = ""; state.scope = "all"; state.onlyNoAccess = false; state.tab = "all"; render(); };
  document.querySelectorAll("#back-list, #back-list-2").forEach(el => el.onclick = () => { state.view = "list"; render(); });
  document.querySelectorAll("[data-dtab]").forEach(el => el.onclick = () => { state.detailTab = el.dataset.dtab; render(); });
}

const PROVIDERS = ["Okta", "Salesforce", "Microsoft Entra ID", "Google", "AWS IAM Identity Center"];
const PERMISSION_SETS = ["EMA Permission Set", "Agentforce Runtime Set", "Vertex Permission Set", "Bedrock Permission Set", "Standard User"];
const SCOPES = ["Sandboxed", "A2A · scoped", "MCP · read-only", "No destructive deletes"];
const draft = { step: "type", kind: "", name: "", run: "", authMode: "", provider: "", callback: "", permission: "", scope: "" };

function openAdd() {
  Object.assign(draft, { step: "type", kind: "", name: "", run: "", authMode: "", provider: "", callback: "", permission: "", scope: "" });
  state.modal = "add";
  render();
}

function choice(key, value, title, body, rec) {
  const on = draft[key] === value;
  return `<button class="choice ${on ? "on" : ""}" data-key="${key}" data-value="${value}"><span class="radio"></span><span><b>${title}${rec ? `<span class="rec">Recommended</span>` : ""}</b><p>${body}</p></span></button>`;
}

function authChoice(value, title, body, extra) {
  const on = draft.authMode === value;
  return `<div class="choice stack ${on ? "on" : ""}">
    <button type="button" class="choice-hit" data-key="authMode" data-value="${value}"><span class="radio"></span><span><b>${title}</b><p>${body}</p></span></button>
    ${on ? `<div class="choice-extra">${extra}</div>` : ""}
  </div>`;
}

function stepReady() {
  if (draft.step === "type") return !!draft.kind;
  if (draft.step === "details") return draft.name.trim().length > 1 && !!draft.run;
  if (draft.step === "access") {
    if (draft.authMode === "OAuth") return /^https?:\/\/\S+$/.test(draft.callback.trim());
    if (draft.authMode === "Enterprise Managed Authorization") return !!draft.provider;
    return false;
  }
  if (draft.step === "permission") return !!draft.permission;
  return true;
}

function renderModal() {
  const root = document.getElementById("modal-root");
  if (state.modal !== "add") { root.innerHTML = ""; return; }
  const stepIndex = { type: 1, details: 2, access: 3, permission: 4, scope: 5 }[draft.step];
  const who = draft.kind === "enterprise" ? "enterprise" : "user";
  let body = "";
  if (draft.step === "type") {
    body = `<h2 style="margin:0 0 6px">What do you want to register?</h2>
      <p class="lede" style="margin-bottom:14px">A user agent acts for the signed-in person. An enterprise agent runs under its own identity.</p>
      ${choice("kind", "user", "User agent", "Acts for the signed-in person. Access follows that user.")}
      ${choice("kind", "enterprise", "Enterprise agent", "Runs under its own identity, including when nobody is signed in.")}`;
  } else if (draft.step === "details") {
    body = `<h2 style="margin:0 0 12px">Name this external ${who} agent</h2>
      <div class="field"><label for="agent-name">External ${who} agent name <span class="req">*</span></label>
        <p class="help">This is the name admins see in the agent list.</p>
        <input id="agent-name" required value="${esc(draft.name)}" />
      </div>
      <div class="field"><label>Where will this agent run? <span class="req">*</span></label></div>
      ${choice("run", "Provider server", "Provider server", "Provider servers can store a client secret.")}
      ${choice("run", "User Local Machine", "User Local Machine", "An agent running locally isn't secure enough to safely store a client secret.")}`;
  } else if (draft.step === "access") {
    const callbackField = `<div class="field"><label for="callback">Callback URL <span class="req">*</span></label><p class="help">The agent URL where the user is redirected after authorization.</p><input id="callback" required placeholder="https://localhost/callback" value="${esc(draft.callback)}" /></div>`;
    const providerField = `<div class="field"><label for="provider">Authentication provider <span class="req">*</span></label><select id="provider" required><option value="">Select</option>${PROVIDERS.map(p => `<option ${draft.provider === p ? "selected" : ""}>${esc(p)}</option>`).join("")}</select></div>`;
    const stepTitle = draft.kind === "enterprise" ? "Assign permissions to your agent" : "Agent authorization setting";
    body = `<h2 style="margin:0 0 6px">${stepTitle}</h2>
      <p class="lede" style="margin-bottom:12px">Required. Choose how this agent authenticates.</p>
      ${authChoice("OAuth", "OAuth", "The user is redirected to a callback URL after authorization.", callbackField)}
      ${authChoice("Enterprise Managed Authorization", "Enterprise Managed Authorization", "The agent authenticates through an authentication provider.", providerField)}`;
  } else if (draft.step === "permission") {
    body = `<h2 style="margin:0 0 6px">Who can use this agent?</h2>
      <p class="lede" style="margin-bottom:12px">Users with this setting can use ${esc(draft.name || "this agent")}.</p>
      <div class="field"><label for="permission">User permission setting <span class="req">*</span></label><select id="permission" required><option value="">Select</option>${PERMISSION_SETS.map(p => `<option ${draft.permission === p ? "selected" : ""}>${esc(p)}</option>`).join("")}</select></div>`;
  } else {
    body = `<h2 style="margin:0 0 6px">Scoped access</h2>
      <p class="lede" style="margin-bottom:12px">Optional. A scope narrows what ${esc(draft.name || "this agent")} can reach. You can leave this empty and add one later.</p>
      <div class="field"><label for="scope-pick">Scoped access <span class="opt">Optional</span></label><select id="scope-pick"><option value="">None</option>${SCOPES.map(p => `<option ${draft.scope === p ? "selected" : ""}>${esc(p)}</option>`).join("")}</select></div>`;
  }
  const steps = [
    ["Agent type", false],
    ["Name and where it runs", false],
    ["Agent authorization setting", false],
    ["Who can use it", false],
    ["Scoped access", true]
  ];
  const vertical = state.variation === "B";
  const stepper = `<ol class="stepper ${vertical ? "vertical" : ""}" aria-label="Registration progress">
      ${steps.map(([label, optional], i) => {
        const n = i + 1;
        const stateName = n < stepIndex ? "done" : n === stepIndex ? "on" : "";
        return `<li class="step ${stateName}" ${n === stepIndex ? 'aria-current="step"' : ""}>
          <span class="dot">${n < stepIndex ? "✓" : n}</span>
          <span>${label}${optional ? `<span class="opt">Optional</span>` : ""}</span>
        </li>`;
      }).join("")}
    </ol>`;
  const content = vertical
    ? `<div class="modal-split"><aside>${stepper}</aside><div class="pane">${body}</div></div>`
    : `<div class="body">${stepper}${body}</div>`;
  root.innerHTML = `<div class="backdrop"><div class="modal ${vertical ? "b" : ""}" role="dialog" aria-labelledby="modal-title">
    <header><h2 id="modal-title">Register agent</h2><button class="x" id="close" aria-label="Close">×</button></header>
    ${content}
    <footer>
      <button class="btn ghost" id="cancel">Cancel</button>
      <span class="spacer note">Step ${stepIndex} of 5 · ${draft.step === "scope" ? "Optional" : "Required"} · nothing is saved until you save</span>
      ${draft.step !== "type" ? `<button class="btn quiet" id="back">Back</button>` : ""}
      <button class="btn primary" id="next" ${stepReady() ? "" : "disabled"}>${draft.step === "scope" ? "Save" : "Continue"}</button>
    </footer>
  </div></div>`;
  root.querySelectorAll("[data-key]").forEach(el => el.onclick = () => { draft[el.dataset.key] = el.dataset.value; renderModal(); bindModal(); });
  const name = document.getElementById("agent-name");
  if (name) name.oninput = () => { draft.name = name.value; syncNext(); };
  const provider = document.getElementById("provider");
  if (provider) provider.onchange = () => { draft.provider = provider.value; syncNext(); };
  const callback = document.getElementById("callback");
  if (callback) callback.oninput = () => { draft.callback = callback.value; syncNext(); };
  const permission = document.getElementById("permission");
  if (permission) permission.onchange = () => { draft.permission = permission.value; syncNext(); };
  const scopePick = document.getElementById("scope-pick");
  if (scopePick) scopePick.onchange = () => { draft.scope = scopePick.value; };
  bindModal();
}

function syncNext() {
  const btn = document.getElementById("next");
  if (btn) btn.disabled = !stepReady();
}

function bindModal() {
  const close = () => { state.modal = null; render(); };
  const c = document.getElementById("close"); if (c) c.onclick = close;
  const cancel = document.getElementById("cancel"); if (cancel) cancel.onclick = close;
  const back = document.getElementById("back");
  if (back) back.onclick = () => {
    draft.step = { details: "type", access: "details", permission: "access", scope: "permission" }[draft.step];
    render();
  };
  const next = document.getElementById("next");
  if (next) next.onclick = () => {
    if (!stepReady()) return;
    if (draft.step === "type") draft.step = "details";
    else if (draft.step === "details") draft.step = "access";
    else if (draft.step === "access") draft.step = "permission";
    else if (draft.step === "permission") draft.step = "scope";
    else return register();
    render();
  };
}

function register() {
  const name = draft.name.trim();
  const needsScope = !draft.scope;
  AGENTS.push({
    name,
    type: draft.kind,
    client: draft.run === "Provider server" ? "Confidential" : "Public",
    auth: draft.authMode === "OAuth" ? "OAuth" : "Enterprise Managed Authorization",
    provider: draft.authMode === "OAuth" ? "Callback URL" : draft.provider,
    access: draft.permission,
    users: draft.kind === "user" ? 0 : undefined,
    scope: needsScope ? "Not scoped" : draft.scope,
    scopeTone: needsScope ? "bad" : "ok",
    needsScope,
    clientId: "3MVG9" + Math.random().toString(36).slice(2, 14),
    run: draft.run,
    callback: draft.callback
  });
  AGENTS.sort((a, b) => a.name.localeCompare(b.name));
  if (needsScope && !UNSCOPED.includes(name)) UNSCOPED.push(name);
  state.modal = null;
  state.view = "list";
  state.tab = "all";
  state.query = "";
  state.scope = "all";
  state.onlyNoAccess = false;
  state.toast = `${name} is saved and now appears in the agent list.`;
  render();
}

(function bindFloat() {
  const float = document.getElementById("variant-float");
  let drag = null;
  float.addEventListener("pointerdown", (e) => {
    if (e.button !== 0) return;
    const box = float.getBoundingClientRect();
    drag = {
      id: e.pointerId,
      x: e.clientX,
      y: e.clientY,
      left: box.left,
      top: box.top,
      moved: false,
      choice: e.target.closest("[data-variant]")
    };
    float.setPointerCapture(e.pointerId);
  });
  float.addEventListener("pointermove", (e) => {
    if (!drag || e.pointerId !== drag.id) return;
    const dx = e.clientX - drag.x;
    const dy = e.clientY - drag.y;
    if (!drag.moved && Math.hypot(dx, dy) < 5) return;
    drag.moved = true;
    float.classList.add("dragging");
    const left = Math.min(Math.max(8, drag.left + dx), window.innerWidth - float.offsetWidth - 8);
    const top = Math.min(Math.max(8, drag.top + dy), window.innerHeight - float.offsetHeight - 8);
    float.style.left = left + "px";
    float.style.top = top + "px";
    float.style.right = "auto";
    float.style.bottom = "auto";
  });
  const end = (e) => {
    if (!drag || e.pointerId !== drag.id) return;
    const choice = drag.moved ? null : drag.choice;
    drag = null;
    float.classList.remove("dragging");
    if (!choice) return;
    state.variation = choice.dataset.variant;
    render();
  };
  float.addEventListener("pointerup", end);
  float.addEventListener("pointercancel", end);
})();

render();
</script>
